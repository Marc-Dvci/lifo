# A check of the testnet contracts and the public page, every 6 hours until 2026-11-25. It reads public endpoints and
# writes nothing to the repository. After the date it ends at once, so stopping the page later never turns the badge red.
name: live
on:
  workflow_dispatch:
  schedule:
    - cron: "23 */6 * * *"
permissions:
  contents: read
env:
  RESULTS_DATE: "2026-11-25"
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Past the date
        id: date
        run: |
          if [ "$(date -u +%F)" \> "$RESULTS_DATE" ]; then echo "Past $RESULTS_DATE: nothing to check."; echo "done=yes" >> "$GITHUB_OUTPUT"; fi
      - if: steps.date.outputs.done != 'yes'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Both contracts have the reviewed code and no access key; the page answers
        if: steps.date.outputs.done != 'yes'
        run: python scripts/live_check.py
