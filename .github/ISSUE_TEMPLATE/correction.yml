name: Report a correction
description: An output names the wrong thing, misreads a source, or disagrees with an official finding.
title: "Correction: "
labels: ["correction"]
body:
  - type: markdown
    attributes:
      value: >
        A finding is a reason to look closer, not a judgement. A correction adds to the record; nothing earlier is
        erased. Please do not post personal data.
  - type: input
    id: item
    attributes:
      label: Which item
      description: The ID or link of the output you are correcting.
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: What is wrong?
      options:
        - It names the wrong thing or place
        - It misreads a source
        - An official finding says otherwise
        - Something else
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details
      description: What the output says, and what you know.
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Source
      description: A link to the report, document or dated photo.
