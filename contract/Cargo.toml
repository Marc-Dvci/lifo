[package]
name = "lifo"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Marc-Dvci/lifo"
description = "A memecoin whose reserve pays the newest buyers first in a crash."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5"
uint = { version = "0.9", default-features = false }

[dev-dependencies]
near-sdk = { version = "5", features = ["unit-testing"] }
