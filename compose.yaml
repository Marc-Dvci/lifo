# docker compose up demo   no keys                       http://localhost:8080
# docker compose up app    live features, keys from .env  http://localhost:8787
#
# Both listen on this machine only: anyone who can reach `app` can spend your API credit.
# Add a named volume to `app` if it keeps state.
services:
  demo:
    build:
      context: .
      target: demo
    image: "lifo:demo"
    ports:
      - "127.0.0.1:8080:8787"

  app:
    build:
      context: .
      target: app
    image: "lifo:app"
    env_file:
      - path: .env
        required: false
    ports:
      - "127.0.0.1:8787:8787"
